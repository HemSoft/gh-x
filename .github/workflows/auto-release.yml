name: Auto Release

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    concurrency:
      group: auto-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check whether release is needed
        id: check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: go run ./.github/scripts/release-plan check

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -count=1

      - name: Determine next version
        if: steps.check.outputs.skip == 'false'
        id: version
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          VERSION_BASE_TAG: ${{ steps.check.outputs.version_base }}
        run: go run ./.github/scripts/release-plan version

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          tag="$TAG"
          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/386"
            "freebsd/amd64"
            "freebsd/arm64"
            "linux/386"
            "linux/amd64"
            "linux/arm"
            "linux/arm64"
            "windows/386"
            "windows/amd64"
            "windows/arm64"
          )
          build_date=$(date -u +%Y-%m-%d)
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            output="dist/${os}-${arch}${ext}"
            echo "Building ${output}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${tag} -X main.buildDate=${build_date}" -o "$output" ./src
          done

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./.github/scripts/release-plan notes

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./.github/scripts/release-plan create

      - name: Load existing release notes
        id: existing_release
        if: steps.check.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          response_headers=$(mktemp)
          if gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$response_headers"; then
            gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^HTTP/[^ ]+ 404 ' "$response_headers"; then
            echo "Tag ${RELEASE_TAG} has no GitHub Release; skipping reconciliation."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat "$response_headers"
            exit 1
          fi

      - name: Update changelog
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: |
          git fetch origin main
          git switch --detach origin/main
          go run ./.github/scripts/release-plan changelog

      - name: Merge changelog update through CI
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already records ${RELEASE_TAG}."
            gh workflow run ci.yml --ref main
            exit 0
          fi

          branch="chore/changelog-${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md
          git commit -m "docs: record ${RELEASE_TAG} release"
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"

          pr_url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: record ${RELEASE_TAG} release" \
              --body "Records the published ${RELEASE_TAG} notes and advances the Unreleased comparison. Generated by the Auto Release workflow.")
          else
            echo "Reusing existing changelog pull request: $pr_url"
          fi
          gh workflow run ci.yml --ref "$branch"

          head_sha=$(git rev-parse HEAD)
          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${head_sha}\") | .databaseId" \
              --limit 10 | head -n 1)
            if [[ -n "$run_id" ]]; then
              break
            fi
            echo "Waiting for changelog CI run (${attempt}/60)..."
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Timed out waiting for changelog CI run."
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_url" --squash --delete-branch
          gh workflow run ci.yml --ref main
