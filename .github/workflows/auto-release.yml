name: Auto Release

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check whether release is needed
        id: check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$RELEASE_SHA" != "$current_main" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer main commit superseded $RELEASE_SHA — skipping auto-release"
            exit 0
          fi

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already has a release tag — skipping auto-release"
            exit 0
          fi

          latest=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          range_start="${latest:-$(git hash-object -t tree /dev/null)}"
          releasable=false
          while IFS= read -r path; do
            case "$path" in
              *.md|.agents/*|LICENSE) ;;
              *) releasable=true; break ;;
            esac
          done < <(git diff --name-only "$range_start" HEAD)

          if [[ "$releasable" == "false" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only documentation or agent metadata changed — skipping auto-release"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.check.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -count=1

      - name: Determine next version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          latest="${{ steps.check.outputs.latest }}"
          if [ -n "$latest" ]; then
            commit_messages=$(git log --format='%s%n%b' "${latest}..HEAD")
          else
            commit_messages=$(git log --format='%s%n%b' HEAD)
          fi

          # Conventional commits: feat: → minor, fix:/refactor:/chore: → patch
          # BREAKING CHANGE or !: → major
          if grep -qiE 'BREAKING[ -]CHANGE|^[a-z]+(\(.+\))?!:' <<< "$commit_messages"; then
            bump="major"
          elif grep -qE '^feat(\(.+\))?:' <<< "$commit_messages"; then
            bump="minor"
          else
            bump="patch"
          fi

          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Could not parse latest tag: $latest"
            exit 1
          fi

          case "$bump" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Auto-releasing as $next ($bump bump, previous: $latest)"

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          tag="$TAG"
          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/386"
            "freebsd/amd64"
            "freebsd/arm64"
            "linux/386"
            "linux/amd64"
            "linux/arm"
            "linux/arm64"
            "windows/386"
            "windows/amd64"
            "windows/arm64"
          )
          build_date=$(date -u +%Y-%m-%d)
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            output="dist/${os}-${arch}${ext}"
            echo "Building ${output}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${tag} -X main.buildDate=${build_date}" -o "$output" ./src
          done

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        run: |
          tag="${{ steps.version.outputs.tag }}"
          latest="${{ steps.check.outputs.latest }}"
          date=$(date -u +%Y-%m-%d)

          # Collect commit subjects since last tag
          if [ -n "$latest" ]; then
            subjects=$(git log --format='- %s' "${latest}..HEAD" --no-merges)
          else
            subjects=$(git log --format='- %s' --no-merges)
          fi

          # Build notes: date header + bullet list
          notes="${date}"$'\n\n'"${subjects}"

          # Write to file (avoids escaping issues in shell)
          echo "$notes" > release-notes.md
          echo "Generated release notes for $tag"
          cat release-notes.md

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading assets with --clobber"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --target "$RELEASE_SHA" \
              --notes-file release-notes.md
          fi
