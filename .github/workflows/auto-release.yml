name: Auto Release

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    concurrency:
      group: auto-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check whether release is needed
        id: check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: go run ./.github/scripts/release-plan check

      - name: Load existing release notes
        id: existing_release
        if: steps.check.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          response_headers=$(mktemp)
          if gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$response_headers"; then
            gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^HTTP/[^ ]+ 404 ' "$response_headers"; then
            echo "Tag ${RELEASE_TAG} has no GitHub Release; skipping reconciliation."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat "$response_headers"
            exit 1
          fi

      - name: Run tests
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        run: go test ./... -count=1

      - name: Determine next version
        if: steps.check.outputs.skip == 'false'
        id: version
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          VERSION_BASE_TAG: ${{ steps.check.outputs.version_base }}
        run: go run ./.github/scripts/release-plan version

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p dist
          tag="$TAG"
          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/386"
            "freebsd/amd64"
            "freebsd/arm64"
            "linux/386"
            "linux/amd64"
            "linux/arm"
            "linux/arm64"
            "windows/386"
            "windows/amd64"
            "windows/arm64"
          )
          build_date=$(git show -s --format=%cs "$RELEASE_SHA")
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            output="dist/${os}-${arch}${ext}"
            echo "Building ${output}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${tag} -X main.buildDate=${build_date}" -o "$output" ./src
          done

      - name: Attest release binaries
        # Initial publication attests the complete set before any upload. A
        # tagged retry reuses those digests instead of signing under a later
        # workflow_run source identity.
        if: steps.check.outputs.skip == 'false'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: 'dist/*'

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./.github/scripts/release-plan notes

      - name: Create release
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: go run ./.github/scripts/release-plan create

      - name: Update changelog
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: |
          git fetch origin main
          git switch --detach origin/main
          go run ./.github/scripts/release-plan changelog

      - name: Queue guarded changelog auto-merge and await completion
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already records ${RELEASE_TAG}."
            if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
              gh workflow run ci.yml --ref main
            fi
            exit 0
          fi

          branch="chore/changelog-${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git fetch origin "$remote_sha"
          fi
          if [[ -n "$remote_sha" ]] && git diff --quiet "$remote_sha" -- CHANGELOG.md; then
            # Keep the review request, evidence and deadline on the original SHA.
            # Keep executing the trusted main checkout's helper, even if main advanced.
            head_sha="$remote_sha"
            echo "Reusing unchanged changelog head $head_sha."
          else
            git add CHANGELOG.md
            git commit -m "docs: record ${RELEASE_TAG} release"
            head_sha=$(git rev-parse HEAD)
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"
          fi

          pr_url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: record ${RELEASE_TAG} release" \
              --body "Records the published ${RELEASE_TAG} notes and advances the Unreleased comparison. Generated by the Auto Release workflow.")
          else
            echo "Reusing existing changelog pull request: $pr_url"
          fi
          if [[ -z "$CODEX_REVIEW_TOKEN" ]]; then
            echo "::error::PR $pr_url head $head_sha requester unavailable: configure CODEX_REVIEW_TOKEN for the connected HemSoft account. No bot review request was posted."
            exit 1
          fi
          # Only this serialized job requests reviews. The dedicated user token
          # is passed to this command; release/merge operations keep GH_TOKEN.
          GH_TOKEN="$CODEX_REVIEW_TOKEN" CHANGELOG_BRANCH="$branch" EXPECTED_HEAD="$head_sha" \
            go run ./.github/scripts/changelog-merge request
          # Bind recovery to this dispatch, not an old failed check for the head.
          if ! ci_run=$(gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="$branch" --jq '.workflow_run_id'); then
            echo "::error::PR $pr_url expected head $head_sha could not create its authoritative CI run; leaving the pull request open."
            exit 1
          fi
          if [[ ! "$ci_run" =~ ^[0-9]+$ ]]; then
            echo "::error::PR $pr_url expected head $head_sha received invalid authoritative run ID '$ci_run'; leaving the pull request open."
            exit 1
          fi
          bash .github/scripts/verify-authoritative-run.sh \
            "$GITHUB_REPOSITORY" "$pr_url" "$head_sha" "$ci_run"

          CHANGELOG_BRANCH="$branch" EXPECTED_HEAD="$head_sha" \
            go run ./.github/scripts/changelog-merge enable
          # A queued auto-merge is not completion. The helper returns only after merge.
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${head_sha}" origin ":refs/heads/${branch}"
          fi
          gh workflow run ci.yml --ref main
