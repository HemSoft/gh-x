name: Auto Release

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check whether release is needed
        id: check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: go run ./.github/scripts/release-plan check

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -count=1

      - name: Determine next version
        if: steps.check.outputs.skip == 'false'
        id: version
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
        run: go run ./.github/scripts/release-plan version

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          tag="$TAG"
          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/386"
            "freebsd/amd64"
            "freebsd/arm64"
            "linux/386"
            "linux/amd64"
            "linux/arm"
            "linux/arm64"
            "windows/386"
            "windows/amd64"
            "windows/arm64"
          )
          build_date=$(date -u +%Y-%m-%d)
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            output="dist/${os}-${arch}${ext}"
            echo "Building ${output}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${tag} -X main.buildDate=${build_date}" -o "$output" ./src
          done

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./.github/scripts/release-plan notes

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./.github/scripts/release-plan create
