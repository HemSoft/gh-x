name: Verify migration credential authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-migration-credential
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository_id == '1262580000' &&
      (github.repository == 'HemSoft/gh-x' || github.repository == 'hemsoft-dev/gh-x') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify existing credential with read-only metadata requests
        shell: pwsh
        env:
          VERIFY_CREDENTIAL_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: >-
          ./scripts/verify-migration-credential.ps1
          -Provider GitHubPAT
          -ExpectedRepositoryId 1262580000
          -OutputPath migration-credential-metadata.json
      - name: Upload public authentication metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-credential-metadata
          path: migration-credential-metadata.json
          if-no-files-found: error
          retention-days: 30
